name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: Florencea/vp-actions/.github/workflows/vp-web-ci.yml@v1
    with:
      pre-test-command: vp run db:seed
      enable-platform-compat: true
